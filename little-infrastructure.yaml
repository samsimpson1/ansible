- name: Little (infra)
  hosts: little
  vars_files:
    - secret.yaml
  become: true
  tasks:
    - name: GitHub Actions SSH key
      ansible.posix.authorized_key:
        user: me
        state: present
        key: |
          ssh-rsa  github-actions
    - name: Tailscale
      ansible.builtin.include_role:
        name: tailscale
    - name: Docker
      ansible.builtin.include_role:
        name: docker_host
    - name: SSMTP
      ansible.builtin.include_role:
        name: ssmtp
    - name: Caddy external
      ansible.builtin.include_tasks: apps/caddy-external.yaml
    - name: Caddy internal
      ansible.builtin.include_tasks: apps/caddy-internal.yaml

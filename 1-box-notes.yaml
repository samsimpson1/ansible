- name: Box (notes)
  hosts: box
  become: true
  vars_files:
    - vars/obsidian.yaml
    - vars/backup.yaml
  tasks:
    - name: Create notes user
      ansible.builtin.user:
        name: notes
        create_home: true
        shell: /usr/bin/bash
        state: present

    - name: Getent
      ansible.builtin.getent:
        database: passwd
        key: notes

    - name: Notes user authorized keys
      ansible.posix.authorized_key:
        user: notes
        state: present
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExdws8cKcBkILoHPObd4FfsVSX6dOHir2O6X8Q9oIEN"
        comment: "Shortcuts"

    - name: Create Notes directories
      ansible.builtin.file:
        path: "/home/notes/{{ item }}"
        state: directory
        owner: notes
        group: notes
        mode: "0750"
      loop:
        - "Obsidian"
        - "Recordings"

    - name: Set facts
      ansible.builtin.set_fact:
        ob_docker_run: "docker run --rm -i -v /home/notes:/home -e HOME=/home -u $(id -u notes):$(id -g notes) ghcr.io/samsimpson1/obsidian-headless:latest"
        notes_uid: "{{ ansible_facts.getent_passwd['notes'].1 }}"
        notes_gid: "{{ ansible_facts.getent_passwd['notes'].2 }}"

    - name: Check sync status
      ansible.builtin.shell:
        cmd: "{{ ob_docker_run }} sync-status --path /home/Obsidian"
      register: sync_status
      changed_when: false
      failed_when: false

    - name: Set up sync
      ansible.builtin.shell:
        cmd: "{{ ob_docker_run }} sync-setup --path /home/Obsidian --vault {{ obsidian_vault_name }} --password {{ obsidian_e2e_password }}"
      when: "'No sync configuration found for' in sync_status.stderr"
      changed_when: true

    - name: Obsidian sync service
      ansible.builtin.include_role:
        name: docker_service
      vars:
        docker_service_id: "obsidian-headless"
        docker_service_description: "Obsidian headless sync client"
        docker_service_image: ghcr.io/samsimpson1/obsidian-headless:latest
        docker_service_command: "sync --continuous --path /home/Obsidian"
        docker_service_user: "{{ notes_uid }}"
        docker_service_groups: ["{{ notes_gid }}"]
        docker_service_env_vars:
          HOME: "/home"
        docker_service_volumes:
          - "/home/notes:/home"

    - name: Vault backup
      ansible.builtin.include_role:
        name: backup_restic
      vars:
        backup_restic_name: box-obsidian
        backup_restic_path: /home/notes/Obsidian
        backup_restic_cron:
          minute: "54"
          hour: "*/2"
- name: Box (notes)
  hosts: box
  become: true
  vars_files:
    - vars/obsidian.yaml
    - vars/backup.yaml
  tasks:
    - name: Install ffmpeg
      ansible.builtin.package:
        name: ffmpeg
        state: present

    - name: Create notes user
      ansible.builtin.user:
        name: notes
        create_home: true
        shell: /usr/bin/bash
        state: present

    - name: Getent
      ansible.builtin.getent:
        database: passwd
        key: notes

    - name: Notes user authorized keys
      ansible.posix.authorized_key:
        user: notes
        state: present
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExdws8cKcBkILoHPObd4FfsVSX6dOHir2O6X8Q9oIEN"
        comment: "Shortcuts"

    - name: Create Notes directories
      ansible.builtin.file:
        path: "/home/notes/{{ item }}"
        state: directory
        owner: notes
        group: notes
        mode: "0700"
      loop:
        - "Obsidian"
        - "Recordings"
        - ".config"
        - ".config/obsidian-headless"

    - name: Create Obsidian auth_token file
      ansible.builtin.copy:
        content: "{{ obsidian_auth_token }}"
        dest: "/home/notes/.config/obsidian-headless/auth_token"
        owner: notes
        group: notes
        mode: "0600"

    - name: Set facts
      ansible.builtin.set_fact:
        ob_docker_run: "docker run --rm -i -v /home/notes:/home -e HOME=/home -u $(id -u notes):$(id -g notes) ghcr.io/samsimpson1/obsidian-headless:latest"
        notes_uid: "{{ ansible_facts.getent_passwd['notes'].1 }}"
        notes_gid: "{{ ansible_facts.getent_passwd['notes'].2 }}"

    - name: Check sync status
      ansible.builtin.shell:
        cmd: "{{ ob_docker_run }} sync-status --path /home/Obsidian"
      register: sync_status
      changed_when: false
      failed_when: false

    - name: Set up sync
      ansible.builtin.shell:
        cmd: "{{ ob_docker_run }} sync-setup --path /home/Obsidian --vault {{ obsidian_vault_name }} --password {{ obsidian_e2e_password }}"
      when: "'No sync configuration found for' in sync_status.stderr"
      changed_when: true

    - name: Obsidian sync service
      ansible.builtin.include_role:
        name: docker_service
      vars:
        docker_service_id: "obsidian-headless"
        docker_service_description: "Obsidian headless sync client"
        docker_service_image: ghcr.io/samsimpson1/obsidian-headless:latest
        docker_service_command: "sync --continuous --path /home/Obsidian"
        docker_service_user: "{{ notes_uid }}"
        docker_service_groups: ["{{ notes_gid }}"]
        docker_service_env_vars:
          HOME: "/home"
        docker_service_volumes:
          - "/home/notes:/home"

    - name: Create processing script
      ansible.builtin.copy:
        content: |
          #!/usr/bin/env bash

          FILE_NAME="${1}"
          FILE_EXT="${2}"

          OUT_FILE="/home/notes/Recordings/${FILE_NAME}.${FILE_EXT}"

          if [ -f "${OUT_FILE}" ]; then
            echo "File ${OUT_FILE} already exists"
            exit 0
          fi

          cp /dev/stdin /home/notes/Recordings/${FILE_NAME}.${FILE_EXT}

          ffmpeg -y -i "/home/notes/Recordings/${FILE_NAME}.${FILE_EXT}" "/home/notes/Recordings/${FILE_NAME}.mp3"

          API_KEY="{{ obsidian_api_key }}"
          NOTES_PATH="/home/notes/Obsidian"

          docker run --rm -i \
            -e "API_KEY=$API_KEY" \
            -e "NOTES_PATH=$NOTES_PATH" \
            -v "/home/notes:/home/notes" \
            -u $(id -u notes):$(id -g notes) \
            ghcr.io/samsimpson1/notes-agent:2026.3.23-215648 \
            "/home/notes/Recordings/${FILE_NAME}.mp3"
        dest: /home/notes/process.sh
        owner: notes
        group: notes
        mode: "0750"

    - name: Vault backup
      ansible.builtin.include_role:
        name: backup_restic
      vars:
        backup_restic_name: box-obsidian
        backup_restic_path: /home/notes/Obsidian
        backup_restic_cron:
          minute: "54"
          hour: "*/2"

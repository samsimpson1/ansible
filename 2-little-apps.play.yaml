- name: Little (apps)
  hosts: little
  become: true
  vars_files:
    - vars/apple-music-gateway.yaml
  tasks:
    - name: Wiki
      ansible.builtin.include_tasks: apps/wiki.yaml
      tags:
        - wiki
    - name: Karakeep
      ansible.builtin.include_tasks: apps/karakeep.yaml
      tags:
        - karakeep
    - name: FreshRSS
      ansible.builtin.include_tasks: apps/freshrss.yaml
      tags:
        - freshrss
    - name: Home Assistant
      ansible.builtin.include_tasks: apps/home-assistant.yaml
      tags:
        - home-assistant
    - name: Miscellaneous
      ansible.builtin.include_tasks: apps/misc.yaml
      tags:
        - misc
    - name: Catbot
      ansible.builtin.include_tasks: apps/catbot.yaml
      tags:
        - catbot
    - name: Samba server
      ansible.builtin.include_role:
        name: samba_server
      tags:
        - samba
    - name: Stonks scraper
      ansible.builtin.include_tasks: apps/stonks-scraper.yaml
      tags:
        - stonks
    - name: Apple Music gateway
      ansible.builtin.include_tasks: apps/apple-music-gateway.yaml
    - name: ShareX directory
      ansible.builtin.file:
        path: "/srv/containers/storage/ssd/sharex"
        state: directory
        owner: app
        group: app
        mode: '0755'
    - name: ShareX nginx site
      ansible.builtin.include_role:
        name: nginx_site
      vars:
        nginx_site_name: sharex
        nginx_site_state: present
        nginx_site_server_names: [sharex.srv.simpson.id]
        nginx_site_kind: external
        nginx_site_certificate: srv.simpson.id
        nginx_site_config: |
          root /sharex;
        nginx_site_volumes:
          - target: /sharex
            source: "/srv/containers/storage/ssd/sharex"
            read_only: true
- name: Create arr data directories
  ansible.builtin.file:
    state: directory
    path: "/srv/containers/storage/ssd/{{ item }}"
    mode: "0750"
    owner: "app"
    group: "app"
  loop:
    - lidarr
    - prowlarr
    - radarr
    - sonarr
- name: Prowlarr docker network
  community.docker.docker_network:
    name: prowlarr
    state: present

- name: Prowlarr service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "prowlarr"
    docker_service_description: "Prowlarr"
    docker_service_image: "{{ container_images.prowlarr }}"
    docker_service_network: [source_default, prowlarr]
    docker_service_user: "568"
    docker_service_groups: ["568"]
    docker_service_env_vars:
      TZ: Europe/London
      PROWLARR__PORT: "80"
    docker_service_volumes:
      - "/srv/containers/storage/ssd/prowlarr:/config:rw"

- name: Prowlarr nginx site
  ansible.builtin.include_role:
    name: nginx_site
  vars:
    nginx_site_name: prowlarr
    nginx_site_state: present
    nginx_site_kind: internal
    nginx_site_server_names: [prowlarr.int.simpson.id]
    nginx_site_certificate: int.simpson.id
    nginx_site_upstream: "http://prowlarr:80"
    nginx_site_networks: [prowlarr]


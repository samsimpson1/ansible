- name: Create media frontend data directories
  ansible.builtin.file:
    state: directory
    path: "/srv/containers/storage/ssd/{{ item }}"
    mode: "0750"
    owner: "app"
    group: "app"
  loop:
    - audiobookshelf
    - audiobookshelf/config
    - audiobookshelf/metadata
    - audiobookshelf/cache
    - plex
    - overseerr
    - pinchflat

- name: Create transcode directory
  ansible.builtin.file:
    state: directory
    path: "/tmp/plex_transcode"
    mode: "0755"
    owner: "app"
    group: "app"

- name: Audiobookshelf service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "audiobookshelf"
    docker_service_description: "Audiobookshelf"
    docker_service_image: "{{ container_images.audiobookshelf }}"
    docker_service_network: [source_default, media]
    docker_service_user: "568"
    docker_service_groups: ["568"]
    docker_service_env_vars:
      TZ: Europe/London
      PORT: "8080"
      AUDIOBOOKSHELF_UID: "568"
      AUDIOBOOKSHELF_GID: "568"
    docker_service_volumes:
      - "/srv/containers/storage/hdd/media:/media:rw"
      - "/srv/containers/storage/ssd/audiobookshelf/config:/config:rw"
      - "/srv/containers/storage/ssd/audiobookshelf/metadata:/metadata:rw"
      - "/srv/containers/storage/ssd/audiobookshelf/cache:/cache:rw"

- name: Audiobookshelf nginx site
  ansible.builtin.include_role:
    name: nginx_site
  vars:
    nginx_site_name: audiobookshelf
    nginx_site_state: present
    nginx_site_kind: external
    nginx_site_server_names: [audiobookshelf.srv.simpson.id]
    nginx_site_certificate: srv.simpson.id
    nginx_site_upstream: "http://audiobookshelf:8080"
    nginx_site_networks: [media]

- name: Plex service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "plex"
    docker_service_description: "Plex Media Server"
    docker_service_image: "{{ container_images.plex }}"
    docker_service_user: "568"
    docker_service_groups: ["568"]
    docker_service_network: host
    docker_service_volumes:
      - "/srv/containers/storage/hdd/media:/media:ro"
      - "/srv/containers/storage/ssd/plex:/config:rw"
      - "/tmp/plex_transcode:/transcode:rw"
    docker_service_devices:
      - "/dev/dri:/dev/dri"

- name: Overseerr service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "overseerr"
    docker_service_description: "Overseerr"
    docker_service_image: "{{ container_images.overseerr }}"
    docker_service_network: [source_default, media]
    docker_service_user: "568"
    docker_service_groups: ["568"]
    docker_service_env_vars:
      TZ: Europe/London
      LOG_LEVEL: info
      PORT: "80"
    docker_service_volumes:
      - "/srv/containers/storage/ssd/overseerr:/app/config:rw"

- name: Overseerr nginx site
  ansible.builtin.include_role:
    name: nginx_site
  vars:
    nginx_site_name: overseerr
    nginx_site_state: present
    nginx_site_kind: external
    nginx_site_server_names: [requests.srv.simpson.id]
    nginx_site_certificate: srv.simpson.id
    nginx_site_upstream: "http://overseerr:80"
    nginx_site_networks: [media]

- name: Pinchflat service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "pinchflat"
    docker_service_description: "Pinchflat"
    docker_service_image: "{{ container_images.pinchflat }}"
    docker_service_network: source_default
    docker_service_user: "568"
    docker_service_groups: ["568"]
    docker_service_env_vars:
      TZ: Europe/London
      EXPOSE_FEED_ENDPOINTS: "true"
    docker_service_volumes:
      - "/srv/containers/storage/ssd/pinchflat:/config:rw"
      - "/srv/containers/storage/hdd/media/youtube:/downloads:rw"

- name: Pinchflat OAuth2 Proxy service
  ansible.builtin.include_role:
    name: oauth2_proxy
  vars:
    oauth2_proxy_id: "pinchflat"
    oauth2_proxy_network: media
    oauth2_proxy_upstreams:
      - "http://pinchflat:8945"
    oauth2_proxy_client_id: "{{ sso_clients.pinchflat.id }}"
    oauth2_proxy_client_secret: "{{ sso_clients.pinchflat.secret }}"
    oauth2_proxy_cookie_secret: "{{ sso_clients.pinchflat.cookie_secret }}"
    oauth2_proxy_skip_auth_routes:
      - "/feed.xml$"
      - "/feed_image.jpg$"
      - "/stream.mp4$"
      - "/episode_image.jpg$"

- name: Pinchflat nginx site
  ansible.builtin.include_role:
    name: nginx_site
  vars:
    nginx_site_name: pinchflat
    nginx_site_state: present
    nginx_site_kind: external
    nginx_site_server_names: [pinchflat.srv.simpson.id]
    nginx_site_certificate: srv.simpson.id
    nginx_site_upstream: "http://pinchflat-oauth2-proxy:4180"
    nginx_site_networks: [media]
- name: Apple Music Gateway data directory
  ansible.builtin.file:
    path: /srv/containers/storage/ssd/apple-music-gateway
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0750"
- name: Apple Music Gateway MusicKit key
  ansible.builtin.copy:
    content: "{{ apple_music_gateway.authkey }}"
    dest: /srv/containers/storage/ssd/apple-music-gateway/AuthKey.p8
    mode: "0400"
    owner: "10001"
    group: "10001"
  no_log: true
- name: Apple Music Gateway service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "apple-music-gateway"
    docker_service_description: "Apple Music Gateway"
    docker_service_image: "{{ container_images.apple_music_gateway }}"
    docker_service_network: source_default
    docker_service_env_vars:
      APPLE_TEAM_ID: "{{ apple_music_gateway.apple_team_id }}"
      APPLE_KEY_ID: "{{ apple_music_gateway.apple_key_id }}"
      APPLE_KEY_PATH: /secrets/AuthKey.p8
      APPLE_SERVICES_ID: "{{ apple_music_gateway.apple_services_id }}"
      SERVICE_TOKEN: "{{ apple_music_gateway.service_token }}"
      GATEWAY_BASE_URL: https://apple-music-gateway.int.simpson.id
      GATEWAY_DB_PATH: /data/gateway.db
    docker_service_volumes:
      - "/srv/containers/storage/ssd/apple-music-gateway:/data"
      - "/srv/containers/storage/ssd/apple-music-gateway/AuthKey.p8:/secrets/AuthKey.p8:ro"

- name: Karakeep data directory
  ansible.builtin.file:
    path: /srv/containers/storage/ssd/karakeep
    state: directory
    mode: '0750'
    owner: app
    group: app
- name: Karakeep Meilisearch service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "karakeep-meilisearch"
    docker_service_description: "Karakeep Meilisearch"
    docker_service_image: getmeili/meilisearch:v1.13.3
    docker_service_network: source_default
    docker_service_env_vars:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: "{{ karakeep.meilisearch_master_key }}"
    docker_service_volumes:
      - "/srv/containers/storage/ssd/karakeep/meilisearch:/meili_data"
- name: Karakeep Chrome service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "karakeep-chrome"
    docker_service_description: "Karakeep Chrome"
    docker_service_image: gcr.io/zenika-hub/alpine-chrome:123
    docker_service_network: source_default
    docker_service_command: --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222 --hide-scrollbars
- name: Karakeep web service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "karakeep-web"
    docker_service_description: "Karakeep Web"
    docker_service_image: ghcr.io/karakeep-app/karakeep:0.27.1
    docker_service_network: source_default
    docker_service_env_vars:
      MEILI_ADDR: http://karakeep-meilisearch:7700
      MEILI_MASTER_KEY: "{{ karakeep.meilisearch_master_key }}"
      BROWSER_WEB_URL: http://karakeep-chrome:9222
      DATA_DIR: /data
      NEXTAUTH_URL: https://bookmarks.srv.simpson.id
      NEXTAUTH_SECRET: "{{ karakeep.nextauth_secret }}"
      DISABLE_SIGNUPS: "true"
      OPENAI_API_KEY: "{{ karakeep.openai_key }}"
      DISABLE_PASSWORD_AUTH: "true"
      OAUTH_PROVIDER_NAME: "Pocket ID"
      OAUTH_WELLKNOWN_URL: "{{ sso_wellknown_url }}"
      OAUTH_CLIENT_ID: "{{ sso_clients.karakeep.id }}"
      OAUTH_CLIENT_SECRET: "{{ sso_clients.karakeep.secret }}"
      OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
    docker_service_volumes:
      - /srv/containers/storage/ssd/karakeep/web:/data

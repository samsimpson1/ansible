- name: Install tools
  ansible.builtin.package:
    name: unzip
    state: present

- name: Create github-actions user
  ansible.builtin.user:
    name: github-actions
    state: present
    shell: /bin/bash
    createhome: true
    home: /srv/app/github-actions
    groups: [docker]

- name: GitHub Actions runner
  ansible.builtin.include_role:
    name: monolithprojects.github_actions_runner
  vars:
    runner_user: github-actions
    runner_dir: /srv/app/github-actions
    access_token: "{{ github_actions_runner_pat }}"
    runner_name: home
    github_account: samsimpson1
    github_repo: ansible

- name: Get current 1Password version
  ansible.builtin.command:
    cmd: |
      bash -c "command -v /srv/app/github-actions/bin/op > /dev/null 2>&1 || { exit 0; } && /srv/app/github-actions/bin/op --version"
  register: onepassword_version_current

- name: Set 1Password version facts
  ansible.builtin.set_fact:
    onepassword_version_desired: "2.32.0"
    onepassword_version_current: "{{ onepassword_version_current['stdout'] }}"

- name: Download 1Password CLI
  ansible.builtin.get_url:
    url: https://cache.agilebits.com/dist/1P/op2/pkg/v{{ onepassword_version_desired }}/op_linux_amd64_v{{ onepassword_version_desired }}.zip
    dest: /tmp/op_linux_amd64.zip
    mode: "0644"
  when: "onepassword_version_current != onepassword_version_desired"

- name: Extract 1Password CLI
  ansible.builtin.unarchive:
    src: /tmp/op_linux_amd64.zip
    dest: /tmp/
    remote_src: true
    creates: /tmp/op
  when: "onepassword_version_current != onepassword_version_desired"

- name: Install 1Password CLI to github-actions bin directory
  ansible.builtin.copy:
    src: /tmp/op
    dest: /srv/app/github-actions/bin/op
    owner: github-actions
    group: github-actions
    mode: "0755"
    remote_src: true
  when: "onepassword_version_current != onepassword_version_desired"

- name: Clean up downloaded files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/op_linux_amd64.zip
    - /tmp/op
  when: "onepassword_version_current != onepassword_version_desired"

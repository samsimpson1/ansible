- name: Desktop Backup (Linux)
  hosts: 127.0.0.1
  connection: local
  tasks:
    - name: Backup directory
      ansible.builtin.file:
        state: directory
        path: /home/sam/.restic-backup
        mode: "0750"
        owner: sam
        group: sam
    - name: Restic env file
      ansible.builtin.copy:
        dest: /home/sam/.restic-backup/env
        content: |
          export SFTP_COMMAND="ssh -o IdentityAgent=none -i $HOME/.restic-backup/key me@10.0.0.191 -s sftp"
          export RESTIC_REPOSITORY="sftp:a:/srv/containers/storage/hdd/restic-backup"
          export RESTIC_PASSWORD="{{ desktop_restic_repository_password }}"
        mode: "0700"
        owner: sam
        group: sam
    - name: Restic excludes file
      ansible.builtin.copy:
        dest: /home/sam/.restic-backup/excludes.txt
        content: |
          /home/sam/.cache/*
          /home/sam/.local/*
          /home/sam/.ollama/*
          /home/sam/Scratch/*
          /home/sam/g/*
          /home/sam/tmpdl/*
          /home/sam/yay/*
          /home/sam/restore/*
          /home/sam/Music/*
          /home/sam/Videos/*
          /home/sam/MEGA/*
          /home/sam/Documents/mega/*
          /home/sam/Games/*
          /home/sam/.cargo/*
          /home/sam/.xlcore/ffxiv/*
          /home/sam/.steam/*
          /home/sam/.steampid/*
          /home/sam/.steampath/*
          /home/sam/.nuget/*
          /home/sam/.pyfa/*
          /home/sam/.npm/*
          /home/sam/.nix-profile/*
          /home/sam/.nix-defexpr/*
          /home/sam/.config/*
          /home/sam/.rustup/*
          node_modules
          lock
        owner: sam
        group: sam
        mode: '0600'
    - name: Restic backup script
      ansible.builtin.copy:
        dest: /home/sam/.restic-backup/backup.sh
        content: |
          #!/usr/bin/env bash

          set -o pipefail
          set -e
          set -x

          RESTIC="/home/sam/.restic-backup/restic.sh"

          # copy Steam user data out of .local
          mkdir -p /home/sam/.steam-user-data
          rsync -avz --delete /home/sam/.local/share/Steam/userdata /home/sam/.steam-user-data

          if ! $RESTIC cat config; then
              echo "repository doesn't exist. creating"
              $RESTIC init
          else
              echo "repository already exists"
          fi

          $RESTIC backup --exclude-file $HOME/.restic-backup/excludes.txt "/home/sam"

          $RESTIC forget -H 24 -d 7 -w 8 -m 12 -y 2
        mode: "0700"
        owner: sam
        group: sam
    - name: Restic script
      ansible.builtin.copy:
        dest: /home/sam/.restic-backup/restic.sh
        content: |
          #!/usr/bin/env bash

          set -o pipefail
          set -e

          source $HOME/.restic-backup/env

          r() {
              restic $@ -o sftp.command="${SFTP_COMMAND}"
          }

          r $@
        mode: "0700"
        owner: sam
        group: sam
    - name: Restic SSH keypair
      community.crypto.openssh_keypair:
        path: /home/sam/.restic-backup/key
        type: ed25519
        owner: sam
        group: sam
    - name: Ensure systemd user directory exists
      ansible.builtin.file:
        path: /home/sam/.config/systemd/user
        state: directory
        mode: '0755'
        owner: sam
        group: sam
    - name: Create restic backup systemd user service
      ansible.builtin.copy:
        dest: /home/sam/.config/systemd/user/restic-backup.service
        content: |
          [Unit]
          Description=Restic Backup Service

          [Service]
          Type=oneshot
          ExecStart=/home/sam/.restic-backup/backup.sh
          WorkingDirectory=/home/sam
          Restart=no
        mode: '0644'
        owner: sam
        group: sam
      notify: Reload systemd user
    - name: Create restic backup systemd user timer
      ansible.builtin.copy:
        dest: /home/sam/.config/systemd/user/restic-backup.timer
        content: |
          [Unit]
          Description=Run restic backup every 2 hours
          Requires=restic-backup.service

          [Timer]
          OnCalendar=00/2:49
          Persistent=true

          [Install]
          WantedBy=timers.target
        mode: '0644'
        owner: sam
        group: sam
      notify: Reload systemd user
    - name: Enable and start restic backup timer
      ansible.builtin.systemd:
        name: restic-backup.timer
        enabled: true
        state: started
        scope: user
        daemon_reload: true
  handlers:
    - name: Reload systemd user
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user

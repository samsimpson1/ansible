- name: Desktop Backup (Linux)
  hosts: 127.0.0.1
  connection: local
  vars_files:
    - secret.yaml
  tasks:
    - name: Backup directory
      ansible.builtin.file:
        state: directory
        path: /home/sam/.restic-backup
        mode: "0750"
        owner: sam
        group: sam
    - name: Restic env file
      ansible.builtin.copy:
        dest: /home/sam/.restic-backup/env
        content: |
          export SFTP_COMMAND="ssh -o IdentityAgent=none -i $HOME/.restic-backup/key me@10.0.0.191 -s sftp"
          export RESTIC_REPOSITORY="sftp:a:/srv/containers/storage/hdd/restic-backup"
          export RESTIC_PASSWORD="{{ desktop_restic_repository_password }}"
        mode: "0700"
        owner: sam
        group: sam
    - name: Restic excludes file
      ansible.builtin.copy:
        dest: /home/sam/.restic-backup/excludes.txt
        content: |
          /home/sam/.cache/*
          /home/sam/.local/*
          /home/sam/.ollama/*
          /home/sam/Scratch/*
          /home/sam/g/*
          /home/sam/tmpdl/*
          /home/sam/yay/*
          /home/sam/restore/*
          /home/sam/Music/*
          /home/sam/Videos/*
          /home/sam/MEGA/*
          /home/sam/Documents/mega/*
          /home/sam/Games/*
          /home/sam/.cargo/*
          /home/sam/.xlcore/ffxiv/*
          /home/sam/.steam/*
          /home/sam/.steampid/*
          /home/sam/.steampath/*
          /home/sam/.nuget/*
          /home/sam/.pyfa/*
          /home/sam/.npm/*
          /home/sam/.nix-profile/*
          /home/sam/.nix-defexpr/*
          /home/sam/.config/*
          /home/sam/.rustup/*
          node_modules
          lock
        owner: sam
        group: sam
        mode: '0600'
    - name: Restic backup script
      ansible.builtin.copy:
        dest: /home/sam/.restic-backup/backup.sh
        content: |
          #!/usr/bin/env bash

          set -o pipefail
          set -e
          set -x

          source $HOME/.restic-backup/env

          # copy Steam user data out of .local
          mkdir -p /home/sam/.steam-user-data
          rsync -avz --delete /home/sam/.local/share/Steam/userdata /home/sam/.steam-user-data

          r() {
              restic $@ -o sftp.command="${SFTP_COMMAND}"
          }

          if ! r cat config; then
              echo "repository doesn't exist. creating"
              r init
          else
              echo "repository already exists"
          fi

          r backup --exclude-file $HOME/.restic-backup/excludes.txt "/home/sam"
        mode: "0700"
        owner: sam
        group: sam
    - name: Restic util script
      ansible.builtin.copy:
        dest: /home/sam/.restic-backup/util.sh
        content: |
          #!/usr/bin/env bash

          set -o pipefail
          set -e

          source $HOME/.restic-backup/env

          r() {
              restic $@ -o sftp.command="${SFTP_COMMAND}"
          }

          r $@
        mode: "0700"
        owner: sam
        group: sam
    - name: Restic SSH keypair
      community.crypto.openssh_keypair:
        path: /home/sam/.restic-backup/key
        type: ed25519
        owner: sam
        group: sam

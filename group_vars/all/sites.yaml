sites:
  - name: sams.wtf
    kind: external
    routes: []
    fallback: |
      handle {
        respond "Nothing to see here."
      }

  - name: srv.simpson.id
    kind: external
    wildcard: true
    routes:
      - name: audiobookshelf
        target: "http://audiobookshelf:8080"
        host: little
      - name: bookmarks
        target: "http://karakeep-web:3000"
        host: little
      - name: budget
        target: "http://actual:5006"
        host: little
      - name: files
        host: little
        custom: |
          @files host files.srv.simpson.id
          handle @files {
            route {
              basic_auth {
                me {{ webdav_basic_auth_password_hash }}
              }
              webdav {
                root /webdav-files
              }
            }
          }
      - name: grafana
        target: "http://grafana:3000"
        host: little
      - name: hass
        target: "http://10.0.0.191:8123"
        host: little
      - name: jellyfin
        target: "http://10.0.0.191:8096"
        host: little
      - name: comics
        target: "http://komga:25600"
        host: little
      - name: immich
        target: "http://immich-server:2283"
        host: box
      - name: navidrome
        target: "http://navidrome:4533"
        host: little
      - name: pathfinder
        target: "http://pathfinder:80"
        host: little
      - name: pinchflat
        target: "http://pinchflat-oauth2-proxy:4180"
        host: little
      - name: pocket-id
        target: "http://pocket-id:1411"
        host: little
      - name: rss
        target: "http://freshrss:80"
        host: little
      - name: requests
        target: "http://overseerr:80"
        host: little
      - name: sharex
        host: little
        custom: |
          @sharex host sharex.srv.simpson.id
          handle @sharex {
            root * /sharex
            file_server
          }
          
  - name: int.simpson.id
    kind: internal
    wildcard: true
    routes:
      - name: firefly-di
        target: "http://firefly-iii-data-importer:8080"
        host: little
      - name: garage
        target: "http://10.0.0.191:3903"
        host: little
      - name: prowlarr
        target: "http://prowlarr:80"
        host: little
      - name: torrent
        target: "http://qbittorrent:80"
        host: little
      - name: radarr
        target: "http://radarr:80"
        host: little
      - name: sabnzbd
        target: "http://sabnzbd:80"
        host: little
      - name: slskd
        target: "http://slskd:5030"
        host: little
      - name: sonarr
        target: "http://sonarr:8989"
        host: little
      - name: prometheus
        target: "http://prometheus:9090"
        host: little

- name: Remove Forgejo Runner directory
  ansible.builtin.file:
    path: "{{ forgejo_runner_directory }}"
    state: absent

- name: Remove Forgejo Runner user
  ansible.builtin.user:
    name: forgejo-runner
    state: absent

- name: Remove Forgejo Runner workflow Docker network
  community.docker.docker_network:
    name: "{{ forgejo_runner_workflow_network }}"
    state: absent

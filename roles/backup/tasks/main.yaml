- name: Install backup dependencies
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - cron
    - restic
    - rsync
    - sshpass
  when: backup_state == 'present'
- name: Enable cron daemon
  ansible.builtin.systemd:
    name: cron
    state: started
    enabled: true
  when: backup_state == 'present'
- name: Create backup directory
  ansible.builtin.file:
    state: directory
    path: /srv/backups
    mode: "0750"
    owner: root
    group: root
  when: backup_state == 'present'
- name: Create password file
  ansible.builtin.copy:
    dest: /srv/backups/password
    content: "{{ backup_target.password }}"
    mode: "0600"
    owner: root
    group: root
  when: backup_state == 'present'
- name: Create repository password file
  ansible.builtin.copy:
    dest: /srv/backups/repository-password
    content: "{{ backup_target.repository_password }}"
    mode: "0600"
    owner: root
    group: root
  when: backup_state == 'present'
- name: Sync jobs
  ansible.builtin.include_tasks: sync.yaml
  when: backup_state == 'present'
- name: Restic jobs
  ansible.builtin.include_tasks: restic.yaml
  when: backup_state == 'present'
- name: Schedule jobs
  ansible.builtin.cron:
    name: "Backup {{ item.op }} {{ item.name }}"
    user: root
    job: "/srv/backups/{{ item.op }}-{{ item.name }}.sh"
    minute: "{{ item.cron.minute | default('0') }}"
    hour: "{{ item.cron.hour | default('*') }}"
    day: "{{ item.cron.day | default('*') }}"
    month: "{{ item.cron.month | default('*') }}"
    weekday: "{{ item.cron.weekday | default('*') }}"
  loop: "{{ backup_jobs }}"
  when: backup_state == 'present'
- name: Create backup configuration file
  ansible.builtin.template:
    src: config.json.j2
    dest: /srv/backups/config.json
    mode: "0640"
    owner: root
    group: root
  when: backup_state == 'present'
- name: Create report send script
  ansible.builtin.template:
    src: report-send.sh.j2
    dest: /srv/backups/report-send.sh
    mode: "0750"
    owner: root
    group: root
  when: backup_state == 'present'
- name: Create report generation script
  ansible.builtin.copy:
    src: report-generate.py
    dest: /srv/backups/report-generate.py
    mode: "0750"
    owner: root
    group: root
  when: backup_state == 'present'
- name: Schedule report job
  ansible.builtin.cron:
    name: "Backup report"
    user: root
    job: "/srv/backups/report-send.sh"
    minute: "0"
    hour: "12"
    day: "*/2"
  when: backup_state == 'present'

- name: Remove backup job cron entries
  ansible.builtin.cron:
    name: "Backup {{ item.op }} {{ item.name }}"
    state: absent
    user: root
  loop: "{{ backup_jobs }}"
  when: backup_state == 'absent'

- name: Remove prune job cron entries
  ansible.builtin.cron:
    name: "Prune {{ item.op }} {{ item.name }}"
    state: absent
    user: root
  loop: "{{ backup_jobs }}"
  when: backup_state == 'absent' and item.op == 'restic'

- name: Remove report job cron entry
  ansible.builtin.cron:
    name: "Backup report"
    state: absent
    user: root
  when: backup_state == 'absent'

- name: Remove backup directory
  ansible.builtin.file:
    path: /srv/backups
    state: absent
  when: backup_state == 'absent'

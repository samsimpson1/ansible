---
- name: Increase max open files
  community.general.pam_limits:
    domain: '*'
    limit_type: "{{ item }}"
    limit_item: nofile
    value: 250000
  loop:
    - soft
    - hard
- name: Concourse Worker data directory
  ansible.builtin.file:
    path: "{{ concourse_worker_data_directory }}"
    state: directory
    owner: app
    group: app
    mode: '0755'

- name: Concourse Worker keys directory
  ansible.builtin.file:
    path: "{{ concourse_worker_data_directory }}/keys"
    state: directory
    owner: app
    group: app
    mode: '0700'

- name: Concourse Worker TSA public key
  ansible.builtin.copy:
    content: "{{ concourse_worker_tsa_public_key }}"
    dest: "{{ concourse_worker_data_directory }}/keys/tsa_host_key.pub"
    owner: app
    group: app
    mode: '0600'

- name: Concourse Worker private key
  ansible.builtin.copy:
    content: "{{ concourse_worker_worker_key }}"
    dest: "{{ concourse_worker_data_directory }}/keys/worker_key"
    owner: app
    group: app
    mode: '0600'

- name: Concourse Worker state directory
  ansible.builtin.file:
    path: "{{ concourse_worker_data_directory }}/work"
    state: directory
    owner: app
    group: app
    mode: '0755'

- name: Pocket ID docker network
  community.docker.docker_network:
    name: "{{ pocket_id_network }}"
    state: "present"

- name: Pocket ID user
  ansible.builtin.user:
    name: pocket-id
    shell: /usr/bin/bash
    create_home: true
    uid: "1985"

- name: Getent passwd
  ansible.builtin.getent:
    database: passwd
  changed_when: false

- name: Set pocket-id uid
  ansible.builtin.set_fact:
    pocket_id_uid: "{{ ansible_facts['getent_passwd']['pocket-id'].1 }}"
  changed_when: false

- name: Pocket ID data directory
  ansible.builtin.file:
    path: "{{ pocket_id_directory }}"
    state: directory
    mode: '0750'
    owner: pocket-id
    group: pocket-id
    recurse: true

- name: Pocket ID encryption key
  ansible.builtin.copy:
    src: encryption.key
    dest: "{{ pocket_id_directory }}/encryption-key.txt"
    mode: '0640'
    owner: pocket-id
    group: pocket-id
  notify: Restart Pocket ID

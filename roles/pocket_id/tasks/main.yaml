- name: Present tasks
  ansible.builtin.include_tasks:
    file: present.yaml
  when: pocket_id_state == 'present'

- name: Pocket ID service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "pocket-id"
    docker_service_description: "Pocket ID"
    docker_service_image: "{{ container_images.pocket_id }}"
    docker_service_network: "{{ pocket_id_network }}"
    docker_service_enabled: "{{ pocket_id_role == 'primary' }}"
    docker_service_state: "{{ pocket_id_state }}"
    docker_service_ports:
      - "127.0.0.1:1411:1411"
    docker_service_env_vars:
      APP_URL: "https://pocket-id.srv.simpson.id"
      APP_NAME: "{{ pocket_id_app_name }}"
      ACCENT_COLOR: "{{ pocket_id_accent_colour }}"
      ENCRYPTION_KEY_FILE: "/data/encryption-key.txt"
      TRUST_PROXY: "true"
      PUID: "{{ pocket_id_uid | default('1985') }}"
      PGID: "{{ pocket_id_uid | default('1985') }}"
      DB_CONNECTION_STRING: "file:/data/pocket-id.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(2500)&_txlock=immediate"
      FILE_BACKEND: "database"
      UI_CONFIG_DISABLED: "true"
      SMTP_FROM: "pocket-id@ses.simpson.id"
      SMTP_USER: "{{ smtp_username }}"
      SMTP_PASSWORD: "{{ smtp_password }}"
      SMTP_HOST: "{{ smtp_hostname }}"
      SMTP_PORT: "{{ smtp_port }}"
      SMTP_TLS: "{{ smtp_tls }}"
    docker_service_volumes:
      - "{{ pocket_id_directory }}:/data"

- name: Pocket ID nginx site
  ansible.builtin.include_role:
    name: nginx_site
  vars:
    nginx_site_name: pocket-id
    nginx_site_state: present
    nginx_site_kind: external
    nginx_site_server_names: [pocket-id.srv.simpson.id]
    nginx_site_certificate: srv.simpson.id
    nginx_site_upstream: "http://pocket-id:1411"
    nginx_site_networks: ["{{ pocket_id_network }}"]

- name: Absent tasks
  ansible.builtin.include_tasks:
    file: absent.yaml
  when: pocket_id_state == 'absent'

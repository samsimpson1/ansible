- name: Create acme user for certificate syncing
  ansible.builtin.user:
    name: "{{ acme_client_source_user }}"
    system: true
    shell: /bin/bash
    create_home: true
    home: "/home/{{ acme_client_source_user }}"

- name: Generate SSH key for acme user
  ansible.builtin.user:
    name: "{{ acme_client_source_user }}"
    generate_ssh_key: true
    ssh_key_type: ed25519
    ssh_key_file: ".ssh/id_ed25519"

- name: Fetch acme user public key
  ansible.builtin.slurp:
    src: "/home/{{ acme_client_source_user }}/.ssh/id_ed25519.pub"
  register: acme_client_pubkey

- name: Display public key for manual configuration
  ansible.builtin.debug:
    msg: "Add this key to {{ acme_client_source_host }}:/home/{{ acme_client_source_user }}/.ssh/authorized_keys: {{ acme_client_pubkey.content | b64decode }}"

- name: Create acme group for certificate access
  ansible.builtin.group:
    name: "{{ acme_client_source_user }}"
    system: true

- name: Add app user to acme group
  ansible.builtin.user:
    name: app
    groups: "{{ acme_client_source_user }}"
    append: true

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ acme_client_cert_dir }}"
    state: directory
    owner: "{{ acme_client_source_user }}"
    group: "{{ acme_client_source_user }}"
    mode: '0775'

- name: Create certificate sync script
  ansible.builtin.template:
    src: sync-certs.sh.j2
    dest: "/opt/sync-certs.sh"
    owner: root
    group: root
    mode: '0755'

- name: Create cron job for certificate sync
  ansible.builtin.cron:
    name: "Sync ACME certificates from {{ acme_client_source_host }}"
    minute: "{{ acme_client_sync_cron_minute }}"
    hour: "{{ acme_client_sync_cron_hour }}"
    job: "/opt/sync-certs.sh >> /var/log/acme-sync.log 2>&1"
    user: "{{ acme_client_source_user }}"

- name: Create acme sudoers entry
  community.general.sudoers:
    name: "acme-client-caddy-restart"
    user: "{{ acme_client_source_user }}"
    runas: "root"
    commands: "/usr/bin/systemctl restart caddy-external caddy-ha"
    state: present
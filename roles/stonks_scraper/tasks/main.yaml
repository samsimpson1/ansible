- name: Stonks scraper data directory
  ansible.builtin.file:
    state: directory
    path: "/srv/containers/storage/ssd/stonks"
    mode: "0750"
    owner: app
    group: app
- name: Stonks scraper image data directory
  ansible.builtin.file:
    state: directory
    path: "/srv/containers/storage/ssd/stonks_image"
    mode: "0755"
    owner: app
    group: app
- name: Stonks files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/srv/containers/storage/ssd/stonks_image/{{ item }}"
    owner: app
    group: app
    mode: "0644"
  loop:
    - Dockerfile
    - requirements.txt
    - scrape.py
- name: Stonks scraper image
  community.docker.docker_image_build:
    name: "localhost/stonks-scraper:latest"
    path: "/srv/containers/storage/ssd/stonks_image"
- name: Stonks scraper service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "stonks-scraper"
    docker_service_description: "Stonks scraper"
    docker_service_image: "localhost/stonks-scraper:latest"
    docker_service_pull_policy: "never"
    docker_service_network: source_default
    docker_service_user: "568"
    docker_service_group: "568"
    docker_service_volumes:
      - "/srv/containers/storage/ssd/stonks:/data:rw"

- name: Caddy data directories
  ansible.builtin.file:
    path: "{{ caddy_data_directory }}/{{ caddy_id }}/{{ item }}"
    state: directory
    owner: app
    group: app
    mode: '0750'
  loop:
    - ""
    - config
    - data
- name: Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ caddy_data_directory }}/{{ caddy_id }}/Dockerfile"
    owner: app
    group: app
    mode: '0644'
  notify: "Restart {{ caddy_id }} caddy"
- name: Caddy image
  community.docker.docker_image_build:
    name: "localhost/{{ caddy_id }}-{{ container_images.caddy }}"
    path: "{{ caddy_data_directory }}/{{ caddy_id }}"
  notify: "Restart {{ caddy_id }} caddy"
- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_data_directory }}/{{ caddy_id }}/Caddyfile"
    owner: app
    group: app
    mode: '0644'
    lstrip_blocks: true
  notify: "Restart {{ caddy_id }} caddy"
- name: Resolve additional group names to GIDs
  ansible.builtin.shell: "getent group {{ item }} | cut -d: -f3"
  register: caddy_group_gids
  loop: "{{ caddy_additional_group_names }}"
  changed_when: false
- name: Set caddy facts
  ansible.builtin.set_fact:
    caddy_volumes_standard:
      - "{{ caddy_data_directory }}/{{ caddy_id }}/config:/config"
      - "{{ caddy_data_directory }}/{{ caddy_id }}/data:/data"
      - "{{ caddy_data_directory }}/{{ caddy_id }}/Caddyfile:/Caddyfile"
      - "/srv/certificates:/certificates:ro"
    caddy_ports:
      - "{{ caddy_http_port }}:{{ caddy_http_port }}"
      - "{{ caddy_https_port }}:{{ caddy_https_port }}"
    caddy_all_groups: "{{ caddy_groups + (caddy_group_gids.results | map(attribute='stdout') | list) }}"
- name: Caddy service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "caddy-{{ caddy_id }}"
    docker_service_description: "Caddy {{ caddy_id }}"
    docker_service_image: "localhost/{{ caddy_id }}-{{ container_images.caddy }}"
    docker_service_pull_policy: "never"
    docker_service_network: "{{ caddy_networks[0] }}"
    docker_service_user: "568"
    docker_service_groups: "{{ caddy_all_groups }}"
    docker_service_command: "caddy run -c /Caddyfile"
    docker_service_env_vars: "{{ caddy_env_vars }}"
    docker_service_ports: "{{ caddy_ports }}"
    docker_service_volumes: "{{ caddy_volumes_standard + caddy_volumes }}"

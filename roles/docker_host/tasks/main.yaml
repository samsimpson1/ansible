- name: Install docker-ce dependencies
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - curl
    update_cache: true
  when: docker_host_state == 'present'
- name: Install Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: docker_host_state == 'present'
- name: Get deb arch
  ansible.builtin.command: dpkg --print-architecture
  register: docker_host_deb_arch
  changed_when: false
  when: docker_host_state == 'present'
- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_host_deb_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
  register: docker_host_docker_repo
  when: docker_host_state == 'present'
- name: Install Docker
  ansible.builtin.apt:
    name: docker-ce
    state: present
    update_cache: "{{ docker_host_docker_repo.changed }}"
  when: docker_host_state == 'present'
- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when: docker_host_state == 'present'

- name: Stop and disable Docker service
  ansible.builtin.systemd:
    name: docker
    state: stopped
    enabled: false
  when: docker_host_state == 'absent'

- name: Remove Docker package
  ansible.builtin.apt:
    name: docker-ce
    state: absent
  when: docker_host_state == 'absent'

- name: Remove Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: absent
  when: docker_host_state == 'absent'

- name: Remove Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: absent
  when: docker_host_state == 'absent'

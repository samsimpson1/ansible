- name: Stop and disable keepalived
  ansible.builtin.service:
    name: keepalived
    enabled: false
    state: stopped

- name: Remove keepalived config file
  ansible.builtin.file:
    path: /etc/keepalived/keepalived.conf
    state: absent

- name: Remove Pocket ID manage script
  ansible.builtin.file:
    path: /etc/keepalived/pocket-id-manage.sh
    state: absent

- name: Remove Caddy HA Docker image
  community.docker.docker_image_remove:
    name: "localhost/ha-{{ container_images.caddy }}"
  ignore_errors: true

- name: Remove Caddy config file
  ansible.builtin.file:
    path: "{{ ha_proxy_directory }}/Caddyfile"
    state: absent

- name: Remove Dockerfile
  ansible.builtin.file:
    path: "{{ ha_proxy_directory }}/Dockerfile"
    state: absent

- name: Remove Caddy data directories
  ansible.builtin.file:
    path: "{{ ha_proxy_directory }}"
    state: absent
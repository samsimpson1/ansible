---
- name: Concourse Docker network
  community.docker.docker_network:
    name: "{{ concourse_web_network }}"
    state: "{{ concourse_web_state }}"

- name: Concourse Web data directory
  ansible.builtin.file:
    path: "{{ concourse_web_data_directory }}/concourse-web"
    state: directory
    owner: app
    group: app
    mode: '0755'
  when: concourse_web_state == 'present'

- name: Concourse Web keys directory
  ansible.builtin.file:
    path: "{{ concourse_web_data_directory }}/concourse-web/keys"
    state: directory
    owner: app
    group: app
    mode: '0700'
  when: concourse_web_state == 'present'

- name: Concourse Web session signing key
  ansible.builtin.copy:
    content: "{{ concourse_web_session_signing_key }}"
    dest: "{{ concourse_web_data_directory }}/concourse-web/keys/session_signing_key"
    owner: app
    group: app
    mode: '0600'
  when: concourse_web_state == 'present'

- name: Concourse Web TSA host key
  ansible.builtin.copy:
    content: "{{ concourse_web_tsa_host_key }}"
    dest: "{{ concourse_web_data_directory }}/concourse-web/keys/tsa_host_key"
    owner: app
    group: app
    mode: '0600'
  when: concourse_web_state == 'present'

- name: Concourse Web TSA authorized keys
  ansible.builtin.copy:
    content: "{{ concourse_web_tsa_authorized_keys }}"
    dest: "{{ concourse_web_data_directory }}/concourse-web/keys/authorized_worker_keys"
    owner: app
    group: app
    mode: '0600'
  when: concourse_web_state == 'present'

- name: PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ concourse_web_data_directory }}/postgres"
    state: directory
    owner: app
    group: app
    mode: '0755'
  when: concourse_web_state == 'present'

- name: PostgreSQL service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "concourse-postgres"
    docker_service_description: "Concourse PostgreSQL Database"
    docker_service_image: "{{ container_images.concourse_postgres }}"
    docker_service_network: "{{ concourse_web_network }}"
    docker_service_user: "568"
    docker_service_groups: ["568"]
    docker_service_env_vars:
      POSTGRES_USER: "{{ concourse_web_postgres_user }}"
      POSTGRES_PASSWORD: "{{ concourse_web_postgres_password }}"
      POSTGRES_DB: "{{ concourse_web_postgres_database }}"
    docker_service_volumes:
      - "{{ concourse_web_data_directory }}/postgres:/var/lib/postgresql"
    docker_service_state: "{{ concourse_web_state }}"

- name: Concourse Web service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "concourse-web"
    docker_service_description: "Concourse CI Web"
    docker_service_image: "{{ container_images.concourse_web }}"
    docker_service_network: "{{ concourse_web_network }}"
    docker_service_user: "568"
    docker_service_groups: ["568"]
    docker_service_command: "web"
    docker_service_ports:
      - "2222:2222"
    docker_service_env_vars:
      CONCOURSE_EXTERNAL_URL: "{{ concourse_web_external_url }}"
      CONCOURSE_POSTGRES_HOST: "concourse-postgres"
      CONCOURSE_POSTGRES_PORT: "5432"
      CONCOURSE_POSTGRES_USER: "{{ concourse_web_postgres_user }}"
      CONCOURSE_POSTGRES_PASSWORD: "{{ concourse_web_postgres_password }}"
      CONCOURSE_POSTGRES_DATABASE: "{{ concourse_web_postgres_database }}"
      CONCOURSE_MAIN_TEAM_LOCAL_USER: "{{ concourse_web_main_team_local_user }}"
      CONCOURSE_OIDC_DISPLAY_NAME: "Pocket ID"
      CONCOURSE_OIDC_CLIENT_ID: "{{ sso_clients.concourse.id }}"
      CONCOURSE_OIDC_CLIENT_SECRET: "{{ sso_clients.concourse.secret }}"
      CONCOURSE_OIDC_ISSUER: "{{ concourse_web_oidc_issuer }}"
      CONCOURSE_OIDC_SCOPE: "openid, profile, groups"
      CONCOURSE_MAIN_TEAM_OIDC_GROUP: "admin"
      CONCOURSE_OIDC_USER_NAME_KEY: "preferred_username"
      CONCOURSE_SESSION_SIGNING_KEY: "/concourse-keys/session_signing_key"
      CONCOURSE_TSA_HOST_KEY: "/concourse-keys/tsa_host_key"
      CONCOURSE_TSA_AUTHORIZED_KEYS: "/concourse-keys/authorized_worker_keys"
    docker_service_volumes:
      - "{{ concourse_web_data_directory }}/concourse-web/keys:/concourse-keys:ro"
    docker_service_state: "{{ concourse_web_state }}"

- name: Remove Concourse Web data directory
  ansible.builtin.file:
    path: "{{ concourse_web_data_directory }}/concourse-web"
    state: absent
  when: concourse_web_state == 'absent'

- name: Remove PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ concourse_web_data_directory }}/concourse-postgres"
    state: absent
  when: concourse_web_state == 'absent'

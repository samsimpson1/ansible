- name: OAuth2 Proxy data directory
  ansible.builtin.file:
    path: "/srv/containers/storage/ssd/{{ oauth2_proxy_id }}-oauth2-proxy"
    state: directory
    owner: app
    group: app
    mode: '0755'

- name: OAuth2 Proxy config file
  ansible.builtin.template:
    src: oauth2-proxy.cfg.j2
    dest: "/srv/containers/storage/ssd/{{ oauth2_proxy_id }}-oauth2-proxy/oauth2-proxy.cfg"
    owner: app
    group: app
    mode: '0644'

- name: OAuth2 Proxy service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: "{{ oauth2_proxy_id }}-oauth2-proxy"
    docker_service_description: "{{ oauth2_proxy_description | default('OAuth2 Proxy for ' + oauth2_proxy_id) }}"
    docker_service_image: "{{ oauth2_proxy_image }}"
    docker_service_network: "{{ oauth2_proxy_network }}"
    docker_service_user: "{{ oauth2_proxy_user }}"
    docker_service_groups: ["{{ oauth2_proxy_group }}"]
    docker_service_command: "oauth2-proxy --config=/oauth2-proxy.cfg"
    docker_service_volumes:
      - "/srv/containers/storage/ssd/{{ oauth2_proxy_id }}-oauth2-proxy/oauth2-proxy.cfg:/oauth2-proxy.cfg:ro"

---
- name: Set Docker service string
  ansible.builtin.set_fact:
    docker_service_network_string: "--network {{ docker_service_network }}"
  when: docker_service_network is string and docker_service_network | length > 0
- name: Set Docker service network list
  ansible.builtin.set_fact:
    docker_service_network_string: >-
      {%- set nets = [] -%}
      {%- for net in docker_service_network -%}
      {%-   set _ = nets.append('--network ' ~ net) -%}
      {%- endfor -%}
      {{ nets | join(' ') }}
  when: docker_service_network is iterable and docker_service_network is not string and docker_service_network | length > 0
- name: Set Docker service network fallback
  ansible.builtin.set_fact:
    docker_service_network_string: ""
  when: docker_service_network is not defined or not docker_service_network

- name: Create quadlet staging directory
  ansible.builtin.file:
    path: "{{ docker_service_quadlet_dir }}"
    state: directory
    mode: "0755"
  when: docker_service_generate_quadlet and docker_service_state == 'present'

- name: Generate quadlet container file
  ansible.builtin.template:
    src: quadlet.container.j2
    dest: "{{ docker_service_quadlet_dir }}/{{ docker_service_id }}.container"
    mode: "0644"
  when: docker_service_generate_quadlet and docker_service_state == 'present'

- name: Remove quadlet container file
  ansible.builtin.file:
    path: "{{ docker_service_quadlet_dir }}/{{ docker_service_id }}.container"
    state: absent
  when: docker_service_generate_quadlet and docker_service_state == 'absent'

- name: Create systemd service unit
  ansible.builtin.template:
    src: service.j2
    dest: /etc/systemd/system/{{ docker_service_id }}.service
    mode: "0644"
  when: docker_service_state == 'present'
  notify: "Restart service {{ docker_service_id }}"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Check if service unit exists
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ docker_service_id }}.service
  register: docker_service_unit_file

- name: Manage Docker service
  ansible.builtin.systemd:
    name: "{{ docker_service_id }}"
    state: "{{ 'stopped' if docker_service_state == 'absent' else 'started' }}"
    enabled: "{{ docker_service_enabled if docker_service_state == 'present' else false }}"
  when: docker_service_unit_file.stat.exists

- name: Remove systemd service unit
  ansible.builtin.file:
    path: /etc/systemd/system/{{ docker_service_id }}.service
    state: absent
  when: docker_service_state == 'absent'

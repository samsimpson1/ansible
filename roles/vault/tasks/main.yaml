---
- name: Present tasks
  ansible.builtin.include_tasks:
    file: present.yaml
  when: vault_state == 'present'

- name: Vault service
  ansible.builtin.include_role:
    name: docker_service
  vars:
    docker_service_id: vault
    docker_service_command: "vault server -config /config.hcl"
    docker_service_image: "{{ container_images.vault }}"
    docker_service_network: "{{ vault_network }}"
    docker_service_user: "{{ vault_uid }}"
    docker_service_volumes:
      - "{{ vault_directory }}/data:/data"
      - "{{ vault_directory }}/config.hcl:/config.hcl"
    docker_service_capabilities:
      - IPC_LOCK
    docker_service_env_vars:
      SKIP_SETCAP: "true"
      SKIP_CHOWN: "true"
    docker_service_state: "{{ vault_state }}"

- name: Vault nginx site
  ansible.builtin.include_role:
    name: nginx_site
  vars:
    nginx_site_name: vault
    nginx_site_state: "{{ vault_state }}"
    nginx_site_kind: internal
    nginx_site_server_names: [vault.int.simpson.id]
    nginx_site_certificate: int.simpson.id
    nginx_site_upstream: "http://vault:8200"
    nginx_site_networks: [vault]

- name: Absent tasks
  ansible.builtin.include_tasks:
    file: absent.yaml
  when: vault_state == 'absent'

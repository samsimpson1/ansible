---
- name: Validate nginx lifecycle settings
  ansible.builtin.assert:
    that:
      - nginx_state in ['present', 'absent']
      - nginx_id is match('^[a-z][a-z0-9_-]*$')
      - nginx_directory is match('^/[^,\s]+$')
      - nginx_directory not in ['/', '/srv', '/srv/app']

- name: Manage nginx lifecycle
  ansible.builtin.include_tasks: "{{ nginx_state }}.yaml"

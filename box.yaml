- name: Box
  hosts: box
  vars_files:
    - secret.yaml
  become: true
  tasks:
    - name: GitHub Actions SSH key
      ansible.posix.authorized_key:
        user: me
        state: present
        key: |
          ssh-rsa  github-actions
    - name: Tailscale
      ansible.builtin.include_role:
        name: tailscale
    - name: Docker
      ansible.builtin.include_role:
        name: docker_host
    - name: App data directory
      ansible.builtin.file:
        path: /mnt/app
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Mount app data device
      ansible.posix.mount:
        path: /mnt/app
        src: UUID=050ce107-d3d2-448a-a5bf-1f8fe15e3c3f
        state: present
        fstype: ext4
        opts: defaults,noatime

- name: Desktop Shell
  hosts: 127.0.0.1
  connection: local
  become: false
  tasks:
    - name: Set AWS Account Detail Facts
      ansible.builtin.set_fact:
        aws_accounts:
          production: "172025368201"
          staging: "696911096973"
          integration: "210287912431"
          tools: "900804735337"
          test: "430354129336"
        aws_roles:
          - developer
          - platformengineer
          - fulladmin
          - dguengineer
          - readonly

    - name: Install packages
      ansible.builtin.package:
        name:
          - asciinema
          - helm
          - kubernetes-cli
          - kubectx
          - virtualenv
        state: present

    - name: Create aws config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.aws"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0700'

    - name: Create aws config file
      ansible.builtin.template:
        src: files/aws.j2
        dest: "{{ ansible_facts['user_dir'] }}/.aws/config"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0640'

    - name: Create bin directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/bin"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0700'

    - name: Create aws-subshell.sh
      ansible.builtin.copy:
        src: files/aws-subshell.sh
        dest: "{{ ansible_facts['user_dir'] }}/bin/aws-subshell.sh"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0750'

    - name: Create aws-login
      ansible.builtin.copy:
        src: files/aws-login.sh
        dest: "{{ ansible_facts['user_dir'] }}/bin/aws-login"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0750'

    - name: Create aws-console
      ansible.builtin.copy:
        src: files/aws-console.sh
        dest: "{{ ansible_facts['user_dir'] }}/bin/aws-console"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0750'

    - name: Create aws.zsh file
      ansible.builtin.template:
        src: files/shell.zsh.j2
        dest: "{{ ansible_facts['user_dir'] }}/.zshrc.d/aws.zsh"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0750'

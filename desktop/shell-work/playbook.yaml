- name: Shell (work config)
  hosts: 127.0.0.1
  connection: local
  tasks:
    - name: Create gc zsh function
      ansible.builtin.copy:
        src: "files/gc.zsh"
        dest: "{{ ansible_facts['user_dir'] }}/.zshrc.d/gc.zsh"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0700'

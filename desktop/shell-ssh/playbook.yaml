- name: Shell (SSH)
  hosts: 127.0.0.1
  connection: local
  vars:
    onepassword_ssh_agent_socket: "{{ ansible_facts['user_dir'] }}/.1password/agent.sock"
    onepassword_ssh_signer: /opt/1Password/op-ssh-sign
    onepassword_ssh_hosts:
      - host: git.sams.wtf
        user: git
        port: 2689
        public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINe/bzJO3dSFJgxUk32R0hAubLZxnZlI1dpFrIx+8Bah
  tasks:
    - name: Tap ssh-askpass
      community.general.homebrew_tap:
        name: theseal/ssh-askpass
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Install macos packages
      ansible.builtin.package:
        name:
          - openssh
          - ykman
          - theseal/ssh-askpass/ssh-askpass
        state: present
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Set YubiKey serial number fact
      ansible.builtin.set_fact:
        yubikey_serials: ["26791998", "36364703"]

    - name: Create .ssh directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.ssh"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0700'

    - name: Create SSH key handles
      ansible.builtin.copy:
        dest: "{{ ansible_facts['user_dir'] }}/.ssh/{{ item }}"
        src: "files/{{ item }}"
        mode: '0600'
        owner: "{{ ansible_facts['user_uid'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
      loop:
        - yubi1.key
        - yubi1.pub
        - yubi2.key
        - yubi2.pub

    - name: Create 1Password SSH public keys (Linux)
      ansible.builtin.copy:
        dest: "{{ ansible_facts['user_dir'] }}/.ssh/{{ item.host }}-1password.pub"
        content: "{{ item.public_key }}\n"
        mode: '0600'
        owner: "{{ ansible_facts['user_uid'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
      loop: "{{ onepassword_ssh_hosts }}"
      loop_control:
        label: "{{ item.host }}"
      when: ansible_facts['system'] == 'Linux'

    - name: Create 1Password Git signing configs (Linux)
      ansible.builtin.template:
        src: templates/gitconfig-1password.j2
        dest: "{{ ansible_facts['user_dir'] }}/.ssh/{{ item.host }}-1password.gitconfig"
        mode: '0640'
        owner: "{{ ansible_facts['user_uid'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
      loop: "{{ onepassword_ssh_hosts }}"
      loop_control:
        label: "{{ item.host }}"
      when: ansible_facts['system'] == 'Linux'

    - name: Create git SSH key detection script
      ansible.builtin.template:
        src: templates/git-ssh-key.sh.j2
        dest: "{{ ansible_facts['user_dir'] }}/.ssh/git-ssh-key"
        mode: '0755'
        owner: "{{ ansible_facts['user_uid'] }}"
        group: "{{ ansible_facts['user_gid'] }}"

    - name: Create allowed_signers file
      ansible.builtin.template:
        src: templates/allowed_signers.j2
        dest: "{{ ansible_facts['user_dir'] }}/.ssh/allowed_signers"
        mode: '0600'
        owner: "{{ ansible_facts['user_uid'] }}"
        group: "{{ ansible_facts['user_gid'] }}"

    - name: Create ssh-agent zshrc script (Linux)
      ansible.builtin.copy:
        dest: "{{ ansible_facts['user_dir'] }}/.zshrc.d/ssh-agent-yubi.zsh"
        content: |
          if [[ -z "$SSH_CONNECTION" ]]; then
            eval $(ssh-agent) > /dev/null

            resk() {
              ssh-add -Dq
              local serial=$(ykman list --serials 2>/dev/null | head -1)
              case "$serial" in
                {{ yubikey_serials[0] }}) ssh-add -q $HOME/.ssh/yubi1.key ;;
                {{ yubikey_serials[1] }}) ssh-add -q $HOME/.ssh/yubi2.key ;;
                *)                        ssh-add -q $HOME/.ssh/yubi1.key $HOME/.ssh/yubi2.key ;;
              esac
            }

            resk
          fi
        mode: '0750'
        owner: "{{ ansible_facts['user_uid'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Create ssh-agent zshrc script (MacOS)
      ansible.builtin.copy:
        dest: "{{ ansible_facts['user_dir'] }}/.zshrc.d/ssh-agent-yubi.zsh"
        content: |
          export SSH_ASKPASS=$(which ssh-askpass)
          export DISPLAY=":0"
          eval $(ssh-agent) > /dev/null

          resk() {
            ssh-add -Dq
            local serial=$(ykman list --serials 2>/dev/null | head -1)
            case "$serial" in
              {{ yubikey_serials[0] }}) ssh-add -q $HOME/.ssh/yubi1.key ;;
              {{ yubikey_serials[1] }}) ssh-add -q $HOME/.ssh/yubi2.key ;;
              *)                        ssh-add -q $HOME/.ssh/yubi1.key $HOME/.ssh/yubi2.key ;;
            esac
          }

          resk
        mode: '0750'
        owner: "{{ ansible_facts['user_uid'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Create gitconfig
      ansible.builtin.template:
        src: templates/gitconfig.j2
        dest: "{{ ansible_facts['user_dir'] }}/.gitconfig"
        mode: '0640'
        owner: "{{ ansible_facts['user_uid'] }}"
        group: "{{ ansible_facts['user_gid'] }}"

    - name: Create gitignore
      ansible.builtin.copy:
        src: files/gitignore
        dest: "{{ ansible_facts['user_dir'] }}/.gitignore"
        mode: '0600'
        owner: "{{ ansible_facts['user_uid'] }}"
        group: "{{ ansible_facts['user_gid'] }}"

    - name: Create ssh config
      ansible.builtin.template:
        src: templates/ssh_config.j2
        dest: "{{ ansible_facts['user_dir'] }}/.ssh/config"
        mode: '0600'
        owner: "{{ ansible_facts['user_uid'] }}"
        group: "{{ ansible_facts['user_gid'] }}"

- name: Visual Studio Code
  hosts: 127.0.0.1
  connection: local
  become: false
  tasks:
    - name: Install VSCode
      ansible.builtin.package:
        name: visual-studio-code
      when: ansible_facts['os_family'] == 'Darwin'

    # CA certs are needed to deal with MITM'd TLS on MAC-Dev- machines
    - name: Extract system CA certs
      ansible.builtin.command:
        cmd: security find-certificate -a -p
      changed_when: false
      when:
        - ansible_facts['os_family'] == 'Darwin'
        - ansible_facts['hostname'] is match('MAC-Dev-.*')
      register: _system_certs

    - name: Write system CA certs to temp file
      ansible.builtin.copy:
        content: "{{ _system_certs.stdout }}"
        dest: "{{ ansible_facts['user_dir'] }}/.system-ca-bundle.pem"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0644'
      when:
        - ansible_facts['os_family'] == 'Darwin'
        - ansible_facts['hostname'] is match('MAC-Dev-.*')

    - name: Set VSCode NODE_EXTRA_CA_CERTS
      ansible.builtin.set_fact:
        vscode_node_extra_ca_certs: "{{ ansible_facts['user_dir'] }}/.system-ca-bundle.pem"
      when:
        - ansible_facts['os_family'] == 'Darwin'
        - ansible_facts['hostname'] is match('MAC-Dev-.*')

    - name: VSCode extensions
      ansible.builtin.set_fact:
        vscode_extensions:
          - Anthropic.claude-code
          - astral-sh.ty
          - charliermarsh.ruff
          - golang.go
          - hashicorp.hcl
          - hashicorp.terraform
          - ms-vscode.makefile-tools
          - redhat.ansible

    - name: Set facts (macOS)
      ansible.builtin.set_fact:
        vscode_config_directory: "{{ ansible_facts['user_dir'] }}/Library/Application Support/Code/User"
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Set facts (Linux)
      ansible.builtin.set_fact:
        vscode_config_directory: "{{ ansible_facts['user_dir'] }}/.config/Code/User"
      when: ansible_facts['os_family'] == 'Archlinux'

    - name: Create settings directory
      ansible.builtin.file:
        path: "{{ vscode_config_directory }}"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0750'

    - name: Create settings.json
      ansible.builtin.copy:
        src: files/settings.json
        dest: "{{ vscode_config_directory }}/settings.json"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0640'

    - name: Install VSCode extensions
      ansible.builtin.shell:
        cmd: NODE_EXTRA_CA_CERTS="{{ vscode_node_extra_ca_certs | default('') }}" code {% for ext in vscode_extensions %}--install-extension {{ ext }} {% endfor %}
      changed_when: '"successfully installed." in vscode_extension_install.stdout'
      register: vscode_extension_install

    - name: Update VSCode extensions
      ansible.builtin.shell:
        cmd: NODE_EXTRA_CA_CERTS="{{ vscode_node_extra_ca_certs | default('') }}" code --update-extensions
      changed_when: '"was successfully updated." in vscode_extension_update.stdout'
      register: vscode_extension_update

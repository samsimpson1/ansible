- name: Pi coding agent
  hosts: 127.0.0.1
  connection: local
  become: false
  vars_files:
    - secret.yaml
  tasks:
    - name: Set facts
      ansible.builtin.set_fact:
        pi_dir: "{{ ansible_facts['user_dir'] }}/.pi"

    - name: Create Pi directory
      ansible.builtin.file:
        path: "{{ pi_dir }}"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0750'

    - name: Clone Pi extensions repo
      ansible.builtin.git:
        repo: "https://git.sams.wtf/tophattedcat/pi.git"
        dest: "{{ pi_dir }}/user-exts"
        version: main

    - name: Link extensions directory
      ansible.builtin.file:
        src: "{{ pi_dir }}/user-exts/.pi/extensions"
        dest: "{{ pi_dir }}/agent/extensions"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        state: link

    - name: Create web-tools config file
      ansible.builtin.template:
        src: files/web.json.j2
        dest: "{{ pi_dir }}/web.json"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0600'

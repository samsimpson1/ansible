- name: Pi coding agent
  hosts: 127.0.0.1
  connection: local
  become: false
  vars_files:
    - secret.yaml
  tasks:
    - name: Set facts
      ansible.builtin.set_fact:
        pi_dir: "{{ ansible_facts['user_dir'] }}/.pi/agent"
        pi_extensions:
          - https://git.sams.wtf/things/pi.git
          - npm:@ff-labs/pi-fff
        pi_personal_bash_permissions_contents: |
          {{ lookup('file', 'files/bash-permissions.json')
            | from_json
            | combine (lookup('file', 'files/personal-bash-permissions-llm-approve.json') | from_json)
            | to_json }}

    - name: Install macos packages
      ansible.builtin.package:
        name:
          - pi-coding-agent
        state: present
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Create Pi directory
      ansible.builtin.file:
        path: "{{ pi_dir }}"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0750'

    - name: Install packages
      ansible.builtin.command:
        cmd: pi install {{ item }}
      register: pi_install
      changed_when: '"Cloning" in pi_install.stderr'
      loop: "{{ pi_extensions }}"

    - name: Update custom package
      ansible.builtin.command:
        cmd: pi update {{ item }}
      register: pi_update
      changed_when: '"HEAD is now at" in pi_update.stderr'
      loop: "{{ pi_extensions }}"

    - name: Create web-tools config file
      ansible.builtin.template:
        src: files/web.json.j2
        dest: "{{ pi_dir }}/web.json"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0600'

    - name: Create models.json file
      ansible.builtin.copy:
        src: "files/personal-models.json"
        dest: "{{ pi_dir }}/models.json"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0600'
      # no openrouter use on work mac, so don't bother creating the models file
      when: "not ansible_facts['hostname'] is match('MAC-Dev-.*')"

    - name: Create skills directory
      ansible.builtin.copy:
        src: "files/skills/"
        dest: "{{ pi_dir }}/skills/"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: preserve

    # subagents aren't useful when you only have 1 model available
    - name: Create subagent config file
      ansible.builtin.copy:
        src: files/subagent.json
        dest: "{{ pi_dir }}/subagent.json"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0600'
      when: "not ansible_facts['hostname'] is match('MAC-Dev-.*')"

    - name: Create bash-permissions config file (work)
      ansible.builtin.copy:
        src: files/bash-permissions.json
        dest: "{{ pi_dir }}/bash-permissions.json"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0600'
      when: "ansible_facts['hostname'] is match('MAC-Dev-.*')"

    - name: Create bash-permissions config file (personal)
      ansible.builtin.copy:
        content: "{{ pi_personal_bash_permissions_contents }}"
        dest: "{{ pi_dir }}/bash-permissions.json"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0600'
      when: "not ansible_facts['hostname'] is match('MAC-Dev-.*')"

    - name: Create APPEND_SYSTEM.md
      ansible.builtin.copy:
        src: files/APPEND_SYSTEM.md
        dest: "{{ pi_dir }}/APPEND_SYSTEM.md"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0600'

    - name: Create zshrc file
      ansible.builtin.copy:
        src: files/zshrc
        dest: "{{ ansible_facts['user_dir'] }}/.zshrc.d/pi.zsh"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0700'

    - name: Clean up old config files
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.pi/{{ item }}"
        state: absent
      loop:
        - web.json
        - subagent.json

- name: Pi coding agent (work)
  hosts: 127.0.0.1
  connection: local
  vars:
    llama_model: "unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q4_K_XL"
    llama_temp: "1.0"
    llama_top_p: "0.95"
    llama_top_k: "20"
    llama_min_p: "0.00"
    llama_mtp_n_max: "2"
  tasks:
    - name: Set facts
      ansible.builtin.set_fact:
        pi_dir: "{{ ansible_facts['user_dir'] }}/.pi/agent"

    - name: Install llama.cpp
      community.general.homebrew:
        name: llama.cpp
        # install HEAD for MTP support
        install_options: HEAD
        state: present

    - name: Create models.json file
      ansible.builtin.template:
        src: "files/work-models.json.j2"
        dest: "{{ pi_dir }}/models.json"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0600'

    - name: Create LaunchAgents directory
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0750'

    - name: Create llama-server launch agent
      ansible.builtin.template:
        src: "files/launch-agent.plist.j2"
        dest: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/id.simpson.sam.llama-server.plist"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0644'

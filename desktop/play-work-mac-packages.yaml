- name: Work Mac Packages
  hosts: 127.0.0.1
  connection: local
  become: false
  tasks:
    - name: Install packages
      ansible.builtin.package:
        name:
          - actionlint
          - ansible
          - ansible-lint
          - awscli
          - claude-code@latest
          - docker-desktop
          - firefox@nightly
          - fzf
          - gh
          - ghostty
          - go
          - k3d
          - keepassxc
          - kind
          - obsidian
          - rbenv
          - ripgrep
          - slack
          - tenv
          - uv
          - visual-studio-code
          - ykman
          - yq
          - yubico-authenticator
          - zed

    - name: Create Ghostty config dir
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/ghostty"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0700'

    - name: Create Ghostty config
      ansible.builtin.copy:
        content: |
          shell-integration-features = ssh-env
          theme = Catppuccin Mocha
        dest: "{{ ansible_facts['user_dir'] }}/.config/ghostty/config"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0640'

    # Firefox Nightly doesn't ship with a wrapper script for the firefox executable
    - name: Create firefox wrapper script
      ansible.builtin.copy:
        content: |
          #!/usr/bin/env bash
          exec '/Applications/Firefox Nightly.app/Contents/MacOS/firefox' "$@"
        dest: "{{ ansible_facts['user_dir'] }}/bin/firefox"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0750'
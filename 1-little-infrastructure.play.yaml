- name: Little (infra)
  hosts: little
  become: true
  tasks:
    - name: GitHub Actions SSH key
      ansible.posix.authorized_key:
        user: me
        state: present
        key: "{{ lookup('file', 'github-actions.pub') }}"

    - name: IP forwarding sysctl
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: true

    - name: Tailscale
      ansible.builtin.include_role:
        name: tailscale
      vars:
        tailscale_advertise_routes: "10.0.0.0/8"

    - name: Docker
      ansible.builtin.include_role:
        name: docker_host

    - name: SSMTP
      ansible.builtin.include_role:
        name: ssmtp

    - name: ShareX SSH key
      ansible.posix.authorized_key:
        user: app
        state: present
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMSjn6O+qaATVQ9r5ZZJol840Q1uKVu0ZrwErYNNTNvM sam@sampc"

    - name: ACME Manager
      ansible.builtin.include_role:
        name: acme_manager
      vars:
        acme_manager_hetzner_api_token: "{{ hetzner_api_token }}"

    - name: Nginx
      ansible.builtin.include_role:
        name: nginx
      vars:
        nginx_directory: "/srv/containers/storage/ssd/nginx"

    - name: Pocket ID
      ansible.builtin.include_role:
        name: pocket_id
      vars:
        pocket_id_role: primary


    - name: Monitoring server
      ansible.builtin.include_role:
        name: monitoring_server
      vars:
        monitoring_server_grafana_extra_volumes:
          - "/srv/containers/storage/ssd/stonks:/stonks:rw"
          - "/srv/containers/storage/ssd/nutrition:/nutrition:rw"

    - name: Vault
      ansible.builtin.include_role:
        name: vault

- name: Little (backup)
  hosts: little
  vars_files:
    - vars/backup.yaml
  become: true
  tasks:
    - name: Duplicacy user
      ansible.builtin.include_tasks: apps/duplicacy-backup.yaml
      tags:
        - duplicacy
    # desktop backup access
    - name: Desktop restic SSH authorised key
      ansible.posix.authorized_key:
        user: me
        key: "{{ lookup('file', 'desktop/backup-linux/files/ssh-key.pub') }}"
        comment: restic

    - name: File storage backup
      ansible.builtin.include_role:
        name: backup_restic
      vars:
        backup_restic_name: file-storage
        backup_restic_path: /srv/containers/storage/hdd/files/
        backup_restic_cron:
          minute: "19"
          hour: "*/2"
      tags:
        - backup

    - name: Karakeep backup
      ansible.builtin.include_role:
        name: backup_restic
      vars:
        backup_restic_name: karakeep
        backup_restic_path: /srv/containers/storage/ssd/karakeep/
        backup_restic_cron:
          minute: "14"
          hour: "*/2"
      tags:
        - backup

    - name: Pocket ID backup
      ansible.builtin.include_role:
        name: backup_restic
      vars:
        backup_restic_name: pocket-id
        backup_restic_path: /srv/containers/storage/ssd/pocket-id/
        backup_restic_cron:
          minute: "18"
          hour: "*/2"
      tags:
        - backup

    - name: Desktop restic sync
      ansible.builtin.include_role:
        name: backup_sync
      vars:
        backup_sync_name: desktop-restic
        backup_sync_path: /srv/containers/storage/hdd/restic-backup/
        backup_sync_cron:
          minute: "49"
          hour: "*/6"
      tags:
        - backup

    - name: SABnzbd backup
      ansible.builtin.include_role:
        name: backup_restic
      vars:
        backup_restic_name: sabnzbd
        backup_restic_path: /srv/containers/storage/ssd/sabnzbd/
        backup_restic_cron:
          minute: "17"
          hour: "5"
        backup_restic_excludes: "/srv/containers/storage/ssd/sabnzbd/Downloads/*"
      tags:
        - backup

    - name: Stonks backup
      ansible.builtin.include_role:
        name: backup_restic
      vars:
        backup_restic_name: stonks
        backup_restic_path: /srv/containers/storage/ssd/stonks/
        backup_restic_cron:
          minute: "16"
          hour: "*/4"
        backup_restic_forget_policy: "-H 24 -d 7 -w 8 -m 6 -y 0"
      tags:
        - backup

    - name: Vault backup
      ansible.builtin.include_role:
        name: backup_restic
      vars:
        backup_restic_name: vault
        backup_restic_path: /srv/containers/storage/ssd/vault/
        backup_restic_cron:
          minute: "11"
          hour: "*/2"
      tags:
        - backup

    - name: Certificates backup
      ansible.builtin.include_role:
        name: backup_restic
      vars:
        backup_restic_name: certificates
        backup_restic_path: /srv/certificates
        backup_restic_cron:
          minute: "0"
          hour: "5"
      tags:
        - backup

    - name: Offline Backup
      ansible.builtin.include_role:
        name: offline_backup
      tags:
        - offline-backup

    - name: Create storage box metrics cron job
      ansible.builtin.cron:
        name: "Storage Box Metrics"
        user: root
        minute: "*/20"
        job: >
          /usr/bin/env docker run
          --rm --pull always
          -e HCLOUD_TOKEN={{ backup_hcloud_token }}
          ghcr.io/samsimpson1/storage-box-metrics:latest
          backup-box
      tags:
        - storage-box-metrics

- name: Box
  hosts: box
  vars_files:
    - container-images.yaml
    - secret.yaml
    - vars/sites.yaml
  become: true
  tasks:
    - name: App user
      ansible.builtin.include_tasks: apps/app-user.yaml
    
    - name: Tailscale
      ansible.builtin.include_role:
        name: tailscale

    - name: Docker
      ansible.builtin.include_role:
        name: docker_host

    - name: App data disk directory
      ansible.builtin.file:
        path: /mnt/app
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Mount app data device
      ansible.posix.mount:
        path: /mnt/app
        src: UUID=050ce107-d3d2-448a-a5bf-1f8fe15e3c3f
        state: mounted
        fstype: ext4
        opts: defaults,noatime

    - name: Root app data directory
      ansible.builtin.file:
        path: /mnt/app/data
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: App data directory
      ansible.builtin.file:
        path: /srv/app
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: App data bind mount
      ansible.posix.mount:
        path: /srv/app
        src: /mnt/app/data
        state: mounted
        fstype: none
        opts: bind

    - name: GitHub Actions SSH key
      ansible.posix.authorized_key:
        user: me
        state: present
        key: "{{ lookup('file', 'github-actions.pub') }}"

    - name: GitHub Actions Runner
      ansible.builtin.include_tasks: apps/github-actions-runner.yaml

    - name: Caddy external
      ansible.builtin.include_role:
        name: caddy
      vars:
        caddy_id: "external"
        caddy_https_port: "6997"
        caddy_http_port: "6996"
        caddy_env_vars:
          CADDY_CLOUDFLARE_API_KEY: "{{ cloudflare_api_key }}"
        caddy_hosts: "{{ sites | selectattr('kind', 'equalto', 'external') }}"
        caddy_data_directory: "/srv/app/caddy"
        caddy_networks: ["immich"]

    - name: Immich
      ansible.builtin.include_tasks: apps/immich.yaml
